[package]
name = "todo"
version = "0.1.2"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "sqlx-mysql", "sqlx-sqlite", "runtime-tokio-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
regex = "1"
pulldown-cmark = { version = "0.13", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"
utoipa = { version = "5", features = ["axum_extras"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"

[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[[test]]
name = "markdown"
path = "tests/markdown.rs"
