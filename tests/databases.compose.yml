services:
  mysql:
    image: mysql:latest
    user: mysql:mysql
    environment:
      MYSQL_ROOT_PASSWORD: local-test-root
      MYSQL_USER: todo
      MYSQL_PASSWORD: local-test-database
      MYSQL_DATABASE: todo
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -u todo -plocal-test-database"]
      interval: 3s
      timeout: 3s
      retries: 60
  mariadb:
    image: mariadb:latest
    user: mysql:mysql
    environment:
      MARIADB_ROOT_PASSWORD: local-test-root
      MARIADB_USER: todo
      MARIADB_PASSWORD: local-test-database
      MARIADB_DATABASE: todo
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "healthcheck.sh --connect --innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  mysql-data:
  mariadb-data:
